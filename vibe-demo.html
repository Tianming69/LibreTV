<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe Coding 弹窗演示</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1020;
      color: #ecf0ff;
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .panel {
      width: min(640px, 92vw);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }
    h1 { margin-top: 0; font-size: 28px; }
    p { color: #b9c3e6; }
    a {
      display: inline-block;
      padding: 11px 18px;
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      background: linear-gradient(135deg, #7c5cff, #5ea7ff);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>正在打开 Vibe Coding 演示窗口…</h1>
    <p>如果浏览器拦截了弹窗，请点击下面按钮手动打开。</p>
    <a href="./vibe.html" target="_blank" rel="noopener">手动打开演示页</a>
  </main>

  <script>
    (function openDemoWindow() {
      const width = 1200;
      const height = 760;
      const left = Math.max(0, Math.floor((window.screen.width - width) / 2));
      const top = Math.max(0, Math.floor((window.screen.height - height) / 2));
      const features = `popup=yes,width=${width},height=${height},left=${left},top=${top},noopener,noreferrer`;
      const win = window.open('./vibe.html', 'vibeCodingDemo', features);

      if (win) {
        win.focus();
      }
    })();
  </script>
</body>
</html>
